org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Pin Gradle's own daemon JVM. Combined with jvmToolchain(21) above, the
# build runs on a stable LTS even when JAVA_HOME points to a newer JDK
# (e.g. JDK 25) that some plugins still don't fully support.
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 built-in Kotlin + KSP workaround.
# KSP 2.3.x still uses kotlin.sourceSets DSL internally; AGP 9 rejects that
# when built-in Kotlin is enabled. The flag re-enables that code path.
# Documented by the Hilt & KSP teams as the recommended workaround for AGP 9.
# Safe to keep; the option will be removed in AGP 10.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
ksp.useKSP2=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
